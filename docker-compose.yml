version: '3.8'

networks:
  strapi-net:
    driver: bridge

services:
  postgres:
    image: postgres:15
    container_name: strapi-db
    restart: always
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi123
      POSTGRES_DB: strapidb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - strapi-net

  strapi:
    build:
      context: .
    container_name: strapi-app
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "1337:1337"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_NAME: strapidb
      DATABASE_HOST: strapi-db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi123
      NODE_ENV: development
    depends_on:
      - postgres
    networks:
      - strapi-net

  nginx:
    image: nginx:latest
    container_name: strapi-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - strapi
    networks:
      - strapi-net

volumes:
  pgdata:
